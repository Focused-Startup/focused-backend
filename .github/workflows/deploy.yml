name: Deploy to Elastic Beanstalk

on:
  push:
    branches:
      - main

concurrency:
  group: 'deploy'
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ./.nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  generate-and-migrate:
    name: Generate Prisma Client and Run Migrations
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ./.nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate prismaclient
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Generate schema types
        run: npm run schema:print

  deploy:
    name: Deploy to Elastic Beanstalk
    runs-on: ubuntu-latest
    needs: [lint-and-test, generate-and-migrate]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ./.nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::979404690153:role/github-elasticbeanstalk
          aws-region: us-east-2

      - name: Deploy to Elastic Beanstalk
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1.0.0
        with:
          aws-region: us-east-2
          application-name: Focused Backend
          environment-name: FocusedBackend